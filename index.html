<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EXCUSE-AS-A-SERVICE</title>

    <meta
        name="description"
        content="Ask anything. Get an excuse."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <a href="index.html" class="logo">
        ☠️ EXCUSE-AS-A-SERVICE
    </a>

    <nav>
        <a href="index.html" class="active">Ask</a>
        <a href="conversations.html">Conversations</a>
    </nav>

</header>


<main class="container">

    <section class="hero">

        <div class="skull">☠️</div>

        <h1>
            ASK ANYTHING.
            <br>
            GET AN EXCUSE.
        </h1>

        <p>
            Believable. Idiotic. Sarcastic. Dark.
            Completely unnecessary.
        </p>

    </section>


    <!-- GENERATOR -->

    <section class="generator">

        <div class="input-card">

            <label for="situation">
                WHAT HAPPENED?
            </label>

            <textarea
                id="situation"
                placeholder="What happened?"
                rows="5"
            ></textarea>

        </div>


        <div class="settings-grid">

            <div class="input-card">

                <label for="style">
                    STYLE
                </label>

                <select id="style">

                    <option value="believable">
                        Believable
                    </option>

                    <option value="professional">
                        Professional
                    </option>

                    <option value="casual">
                        Casual
                    </option>

                    <option value="sarcastic">
                        Sarcastic
                    </option>

                    <option value="idiotic">
                        Idiotic
                    </option>

                    <option value="dark humor">
                        Dark Humor
                    </option>

                    <option value="absurd">
                        Absurd
                    </option>

                    <option value="corporate">
                        Corporate
                    </option>

                    <option value="dramatic">
                        Dramatic
                    </option>

                    <option value="passive-aggressive">
                        Passive Aggressive
                    </option>

                </select>

            </div>


            <div class="input-card">

                <label for="conversationCount">
                    CONVERSATIONS
                </label>

                <select id="conversationCount">

                    <option value="1">1</option>
                    <option value="3">3</option>
                    <option value="5" selected>5</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>

                </select>

            </div>

        </div>


        <button
            id="generateButton"
            class="primary-button"
            type="button"
        >
            ☠️ GENERATE
        </button>

    </section>


    <!-- RESULTS -->

    <section class="results">

        <div
            class="section-heading"
            id="resultHeading"
        >
            GENERATED EXCUSES
        </div>

        <div id="results"></div>

    </section>

</main>


<footer>
    EXCUSE-AS-A-SERVICE · NO ACCOUNTS · NO TRACKING · NO DATABASE
</footer>


<!-- DATA -->

<script src="data/content.js"></script>

<!-- SCREENSHOT SUPPORT -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- APPLICATION -->

<script src="app.js"></script>

</body>
</html>
