<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Random absurd conversations from EXCUSE-AS-A-SERVICE."
    >

    <title>Random Conversations — EXCUSE-AS-A-SERVICE</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<!-- =====================================================
     TOPBAR
===================================================== -->

<header class="topbar">

    <a
        href="index.html"
        class="logo"
    >
        ☠️ EXCUSE-AS-A-SERVICE
    </a>

    <nav>

        <a href="index.html">
            Ask
        </a>

        <a href="conversations.html">
            Conversations
        </a>

    </nav>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

    <!-- =================================================
         HERO
    ================================================== -->

    <section class="hero">

        <div class="skull">
            💬
        </div>

        <h1>
            RANDOM CONVERSATIONS
        </h1>

        <h2>
            ABSOLUTELY UNNECESSARY
        </h2>

        <p>
            Choose how many conversations you want.
            Every generation picks different conversations.
        </p>

    </section>


    <!-- =================================================
         CONTROLS
    ================================================== -->

    <section class="generator-card">

        <label for="conversationCount">
            NUMBER OF CONVERSATIONS
        </label>

        <select
            id="conversationCount"
        >

            <option value="1">
                1 Conversation
            </option>

            <option value="3">
                3 Conversations
            </option>

            <option
                value="5"
                selected
            >
                5 Conversations
            </option>

            <option value="10">
                10 Conversations
            </option>

            <option value="20">
                20 Conversations
            </option>

            <option value="50">
                50 Conversations
            </option>

        </select>


        <button
            id="generateConversations"
            class="primary-button"
            type="button"
            style="margin-top: 15px;"
        >
            ☠️ GENERATE CONVERSATIONS
        </button>

    </section>


    <!-- =================================================
         RESULTS
    ================================================== -->

    <section class="results">

        <div
            class="section-heading"
            id="resultHeading"
        >
            RANDOM CONVERSATIONS
        </div>


        <div
            id="conversationContainer"
        ></div>


        <button
            id="generateMore"
            class="share-all"
            type="button"
        >
            🔄 GENERATE MORE
        </button>

    </section>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    NO ACCOUNTS · NO DATABASE · NO TRACKING

</footer>


<!-- =====================================================
     DATA
===================================================== -->

<script src="data/content.js"></script>

<script src="conversations.js"></script>

</body>

</html>
