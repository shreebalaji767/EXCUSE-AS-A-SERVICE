<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Random Conversations | EXCUSE-AS-A-SERVICE
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="topbar">

    <a
        href="index.html"
        class="logo"
    >
        ☠️ EXCUSE-AS-A-SERVICE
    </a>


    <nav>

        <a href="index.html">
            Ask
        </a>

        <a
            href="conversations.html"
            class="active"
        >
            Conversations
        </a>

    </nav>

</header>



<main class="container">


    <section class="hero">

        <div class="skull">
            💬
        </div>

        <h1>
            RANDOM CONVERSATIONS
        </h1>

        <p>
            Generate completely unnecessary
            conversations between completely
            unnecessary people.
        </p>

    </section>



    <section class="generator-controls">

        <div class="control-group">

            <label for="conversationCount">
                NUMBER OF CONVERSATIONS
            </label>

            <select
                id="conversationCount"
            >

                <option value="1">
                    1 Conversation
                </option>

                <option value="3">
                    3 Conversations
                </option>

                <option
                    value="5"
                    selected
                >
                    5 Conversations
                </option>

                <option value="10">
                    10 Conversations
                </option>

                <option value="20">
                    20 Conversations
                </option>

                <option value="50">
                    50 Conversations
                </option>

            </select>

        </div>


        <button
            id="generateConversations"
            class="primary-button"
            type="button"
        >
            ☠️ GENERATE CONVERSATIONS
        </button>

    </section>



    <section class="results">

        <div
            class="section-heading"
            id="resultHeading"
        >
            RANDOM CONVERSATIONS
        </div>


        <div
            id="conversationContainer"
        ></div>


        <button
            id="generateMore"
            class="share-all"
            type="button"
        >
            🔄 GENERATE MORE
        </button>

    </section>


</main>



<footer>

    NO ACCOUNTS · NO DATABASE · NO TRACKING

</footer>



<script src="data/content.js"></script>

<script src="conversations.js"></script>


</body>

</html>
